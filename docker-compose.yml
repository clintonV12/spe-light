version: "3.9"

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     stratplan
      POSTGRES_PASSWORD: stratplan
      POSTGRES_DB:       stratplan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratplan"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (self-hosted LLM) ────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Pull a model after first start:
    #   make ollama-pull-llama3    (recommended — ~5GB, 8GB RAM)
    #   make ollama-pull-mistral   (alternative  — ~4GB, 6GB RAM)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── SPE-Light API server ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://stratplan:stratplan@postgres:5432/stratplan?sslmode=disable
      OLLAMA_URL:   http://ollama:11434
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  ollama_data: